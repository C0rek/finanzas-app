<header class="encabezado">
  <div class="titulos">
    @if (titulo()) {
      <h2 class="titulo">{{ titulo() }}</h2>
    }
    @if (subtitulo()) {
      <p class="subtitulo">{{ subtitulo() }}</p>
    }
  </div>
  <!-- ng-content es un "hueco" donde va lo que el padre pone entre las etiquetas.
       select="[accion]" toma solo los elementos marcados con el atributo accion. -->
  <ng-content select="[accion]" />
</header>
