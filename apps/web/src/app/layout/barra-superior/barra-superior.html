<div class="marca">
  <!-- Logotipo provisorio, hasta exportar el definitivo de Pencil: "nonio" con el punto de la i
       reemplazado por una marca de escala. Se usa la ı sin punto, por eso lleva aria-label. -->
  <span class="logotipo" role="img" aria-label="Nonio">
    <span aria-hidden="true">non<span class="logotipo-i">ı<span class="logotipo-marca"></span></span>o</span>
  </span>
</div>

<!-- Todavía sin funcionalidad: el modo oscuro y las notificaciones vienen más adelante. -->
<button class="accion" type="button" aria-label="Modo oscuro">
  <svg lucideMoon [size]="18"></svg>
</button>
<button class="accion" type="button" aria-label="Notificaciones">
  <svg lucideBell [size]="18"></svg>
</button>
<span class="avatar">TZ</span>
