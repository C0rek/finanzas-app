<app-card titulo="Evolución del patrimonio" subtitulo="En miles de US$, cierre de cada mes">
  <button accion class="selector" type="button">
    12 meses <svg lucideChevronDown [size]="14"></svg>
  </button>

  <div class="grafico">
    <div class="eje" aria-hidden="true">
      @for (marca of marcas(); track marca) {
        <span>{{ marca }}</span>
      }
    </div>

    <ol class="barras">
      <!-- $last es true en la última vuelta del @for: el mes actual va resaltado. -->
      @for (b of barras(); track b.mes; let ultimo = $last) {
        <li class="columna" [title]="b.mes + ': ' + (b.valorUsd | decimal: { prefijo: 'US$ ' })">
          <div class="area">
            <div class="barra" [class.actual]="ultimo" [style.height.%]="b.altoPorcentaje"></div>
          </div>
          <span class="mes">{{ b.mes }}</span>
        </li>
      }
    </ol>
  </div>
</app-card>
