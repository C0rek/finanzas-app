@let r = resumen();

<app-encabezado-pagina [titulo]="'Resumen · ' + r.periodo" [descripcion]="descripcion()">
  <!-- El import CSV y el formulario vienen después: por ahora quedan bloqueados. -->
  <button class="boton boton--secundario" type="button" disabled title="Próximamente">
    <svg lucideDownload [size]="16"></svg> Importar CSV <span class="boton__pronto">Próximamente</span>
  </button>
  <app-boton-sincronizar />
  <button class="boton boton--primario" type="button" disabled title="Próximamente">
    <svg lucidePlus [size]="16"></svg> Nuevo movimiento <span class="boton__pronto">Próximamente</span>
  </button>
</app-encabezado-pagina>

<!-- Fila 1: exposición a BTC a la izquierda; patrimonio y resultado apilados a la derecha. -->
<section class="fila fila-1">
  <app-exposicion-btc />
  <div class="pila">
    <app-patrimonio />
    <app-resultado />
  </div>
</section>

<!-- Fila 2: evolución a la izquierda, posiciones a la derecha. -->
<section class="fila fila-2">
  <app-evolucion-patrimonio />
  <app-tabla-posiciones [limite]="5" />
</section>
