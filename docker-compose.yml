# Postgres para desarrollo local.
# Uso: `docker compose up -d` (levanta) · `docker compose down` (apaga).
# Los datos quedan en el volumen "postgres-data" aunque apagues el contenedor.
#
# Usuario y contraseña son solo para tu máquina (coinciden con apps/api/.env.example).
services:
  postgres:
    image: postgres:16
    container_name: finanzas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas_dev
      POSTGRES_DB: finanzas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
